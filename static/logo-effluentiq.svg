<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" role="img" aria-labelledby="t">
  <title id="t">EffluentIQ — Industrial Wastewater Monitoring &amp; Reporting</title>
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#c98a12"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#f0b429"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Mark: a water drop with a live monitoring pulse -->
  <g transform="translate(10 8)">
    <path d="M52 2 C52 2 18 42 18 66 A34 34 0 0 0 86 66 C86 42 52 2 52 2 Z" fill="url(#drop)"/>
    <path d="M52 2 C52 2 18 42 18 66 A34 34 0 0 0 86 66 C86 42 52 2 52 2 Z" fill="none" stroke="url(#ring)" stroke-width="3"/>
    <path d="M26 70 H40 L46 56 L54 84 L61 62 L66 70 H78" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="78" cy="70" r="4.5" fill="#ffffff"/>
  </g>
  <!-- Wordmark -->
  <text x="112" y="70" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="0.5" fill="#f1f9ff">Effluent<tspan fill="#f5c542">IQ</tspan></text>
  <text x="114" y="100" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.8" fill="#a9c5d4">INDUSTRIAL WASTEWATER MONITORING &amp; REPORTING</text>
</svg>
